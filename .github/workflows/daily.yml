name: scan

on:
  schedule:
    # Three looks a day, placed on the hours postings actually land rather than spread
    # evenly around the clock. Measured over AMD's 630 US requisitions, 95% were posted
    # between 06:00 and 17:00 Pacific and peaked at 08:00; the whole 00:00-05:00 window
    # held 1.6% between it. Scanning the dead hours costs runs and finds nothing, so
    # these three sit at 09:00, 13:00 and 17:00 Pacific.
    #
    # That is fewer runs than an every-six-hours schedule and a shorter wait during the
    # hours that matter: at most four hours from posting to digest through the working
    # day, against six. The overnight gap is long but nearly empty, and anything posted
    # in it is picked up by the 09:00 run the same morning.
    #
    # The :04 offset matters as much as the hours. Scheduled runs are queued, and the
    # top of the hour is the most contended slot on Actions, where this workflow has
    # been observed starting anywhere from 16 minutes to two hours late.
    #
    # GitHub evaluates cron in UTC only and never observes daylight saving time, so
    # these land an hour earlier in local terms from November to March: 08:00, 12:00
    # and 16:00 Pacific, which is still inside the active window.
    - cron: "4 16,20,0 * * *"
  workflow_dispatch:

# Only contents:write is granted, so the state commit can be pushed. Naming any
# permission here drops every other scope to none.
permissions:
  contents: write

# One run at a time. A second run must not race the first over the spreadsheet
# or data/state.json, and cancelling mid-run could leave the sheet updated with
# the state file unsaved.
concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag, so this must be an exact version.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      # The CLI appends its digest to $GITHUB_STEP_SUMMARY, which Actions injects
      # into every step's environment, so the digest lands in the run summary
      # without a separate step.
      - name: Scan job boards
        env:
          JOB_RADAR_SHEET_ID: ${{ secrets.JOB_RADAR_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: uv run job-radar

      # This workflow has no `push` trigger, and pushes authenticated with the
      # default GITHUB_TOKEN do not start new workflow runs, so committing here
      # cannot loop back into another scan.
      - name: Commit updated state
        run: |
          if git diff --quiet -- data/state.json; then
            echo "data/state.json unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore(state): jobs seen at $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
